<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bantuan Kecemasan (SOS) - Event Larian</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #fff5f5; color: #333; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 20px; }
        
        .card { background: white; border-radius: 16px; padding: 28px 22px; max-width: 420px; width: 100%; margin: auto; box-shadow: 0 10px 25px rgba(229, 62, 62, 0.12); border: 2px solid #feb2b2; text-align: center; }
        
        .icon-sos { font-size: 3rem; margin-bottom: 10px; }
        h1 { color: #c53030; font-size: 1.4rem; margin-bottom: 8px; }
        p.desc { font-size: 0.9rem; color: #4a5568; margin-bottom: 20px; line-height: 1.5; }
        
        label { display: block; text-align: left; font-size: 0.85rem; font-weight: 700; color: #2d3748; margin-bottom: 6px; }
        input[type="text"] { width: 100%; padding: 14px; font-size: 1.1rem; border: 2px solid #cbd5e0; border-radius: 10px; margin-bottom: 16px; text-align: center; font-weight: bold; text-transform: uppercase; }
        input[type="text"]:focus { outline: none; border-color: #e53e3e; }
        
        .btn-sos { background: #e53e3e; color: white; border: none; padding: 18px 15px; font-size: 1.05rem; font-weight: bold; border-radius: 10px; width: 100%; cursor: pointer; box-shadow: 0 4px 10px rgba(229, 62, 62, 0.35); }
        .btn-sos:active { background: #c53030; }

        .btn-wa { display: none; background: #25D366; color: white; text-decoration: none; padding: 18px 15px; font-size: 1.05rem; font-weight: bold; border-radius: 10px; width: 100%; margin-top: 12px; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.35); }
        
        .divider { margin: 18px 0; font-size: 0.8rem; color: #a0aec0; display: flex; align-items: center; }
        .divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid #e2e8f0; }
        .divider span { padding: 0 10px; }

        .btn-call { display: block; text-align: center; background: #2d3748; color: white; text-decoration: none; padding: 14px; border-radius: 10px; font-size: 0.95rem; font-weight: 600; }

        #status { margin-top: 15px; font-size: 0.85rem; font-weight: 600; color: #2d3748; line-height: 1.4; }
        .note { margin-top: 20px; font-size: 0.75rem; color: #718096; line-height: 1.4; }
    </style>
</head>
<body>

<div class="card">
    <div class="icon-sos">🚨</div>
    <h1>BANTUAN KECEMASAN (SOS)</h1>
    <p class="desc">Masukkan <strong>Nombor Bib</strong> anda dan tekan butang merah di bawah untuk mengesan lokasi GPS semasa.</p>
    
    <label for="bibNo">Nombor Bib Peserta:</label>
    <input type="text" id="bibNo" placeholder="Contoh: A1024">
    
    <button type="button" class="btn-sos" id="btnKesan" onclick="mulaProsesSOS()">📍 1. KESAN LOKASI GPS SAYA</button>
    
    <div id="status"></div>

    <a href="#" id="linkWhatsApp" class="btn-wa">📲 2. HANTAR KE WHATSAPP MEDIC</a>

    <div class="divider"><span>ATAU</span></div>

    <a href="tel:+60139384045" class="btn-call">📞 Panggil Terus Hotline (013-938 4045)</a>

    <p class="note">Sila pastikan fungsi <strong>Location / GPS</strong> telefon pintar anda diaktifkan.</p>
</div>

<script>
    const NO_WHATSAPP_MEDIC = "60139384045";
    let sudahSelesai = false;

    function mulaProsesSOS() {
        const bibInput = document.getElementById('bibNo').value.trim().toUpperCase();
        const status = document.getElementById('status');
        const linkWA = document.getElementById('linkWhatsApp');

        if (bibInput === "") {
            alert("Sila masukkan Nombor Bib anda terlebih dahulu!");
            document.getElementById('bibNo').focus();
            return;
        }

        sudahSelesai = false;
        status.style.color = "#2b6cb0";
        status.innerText = "⏳ Sedang mengesan koordinat GPS...";
        linkWA.style.display = "none";

        // Pemasa keselamatan 3.5 saat jika pelayar menyekat GPS secara senyap
        const timerKeselamatan = setTimeout(function() {
            if (!sudahSelesai) {
                sudahSelesai = true;
                paparButangWA(bibInput, null, "⚠️ GPS tidak dapat diakses (mungkin disekat pada tetapan pelayar).");
            }
        }, 3500);

        if (!navigator.geolocation) {
            clearTimeout(timerKeselamatan);
            sudahSelesai = true;
            paparButangWA(bibInput, null, "⚠️ Pelayar web tidak menyokong GPS.");
            return;
        }

        navigator.geolocation.getCurrentPosition(
            function(pos) {
                if (sudahSelesai) return;
                clearTimeout(timerKeselamatan);
                sudahSelesai = true;
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                paparButangWA(bibInput, https://google.com{lat},${lng}, "✅ Lokasi GPS berjaya dikesan!");
            },
            function(err) {
                if (sudahSelesai) return;
                clearTimeout(timerKeselamatan);
                sudahSelesai = true;
                paparButangWA(bibInput, null, "⚠️ Akses GPS ditolak atau ditutup pada telefon.");
            },
            { enableHighAccuracy: false, timeout: 3000, maximumAge: 60000 }
        );
    }

    function paparButangWA(bib, pautanMaps, mesejStatus) {
        const status = document.getElementById('status');
        const linkWA = document.getElementById('linkWhatsApp');
        const btnKesan = document.getElementById('btnKesan');

        let teksMesej = 🚨 *KECEMASAN LARIAN (SOS)* 🚨\n\n*No. Bib:* ${bib}\n;
        
        if (pautanMaps) {
            teksMesej += *Lokasi GPS:* ${pautanMaps}\n\n;
            status.style.color = "#2f855a";
        } else {
            teksMesej += *Lokasi:* (Sila hantar Live Location / kongsi lokasi di WhatsApp)\n\n;
            status.style.color = "#c53030";
        }
        
        teksMesej += Mohon bantuan Medic / Urus Setia segera!;

        linkWA.href = https://wa.me{NO_WHATSAPP_MEDIC}?text=${encodeURIComponent(teksMesej)};
        linkWA.style.display = "block";
        btnKesan.style.background = "#718096";
        status.innerHTML = ${mesejStatus}<br>Tekan butang hijau di bawah untuk membuka WhatsApp:;
    }
</script>

</body>
</html>
