<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bantuan Kecemasan (SOS)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #fff5f5; color: #333; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: white; border-radius: 16px; padding: 25px 20px; max-width: 400px; width: 100%; box-shadow: 0 8px 20px rgba(0,0,0,0.1); border: 2px solid #feb2b2; text-align: center; }
        h1 { color: #c53030; font-size: 1.35rem; margin: 10px 0; }
        p.desc { font-size: 0.9rem; color: #4a5568; margin-bottom: 18px; line-height: 1.4; }
        
        .gps-box { background: #edf2f7; padding: 10px; border-radius: 8px; font-size: 0.8rem; margin-bottom: 15px; color: #2d3748; font-weight: bold; }
        
        input[type="text"] { width: 100%; padding: 14px; font-size: 1.2rem; border: 2px solid #cbd5e0; border-radius: 10px; margin-bottom: 15px; text-align: center; font-weight: bold; text-transform: uppercase; }
        
        .btn-wa { display: block; background: #25D366; color: white; text-decoration: none; padding: 16px; font-size: 1.05rem; font-weight: bold; border-radius: 10px; width: 100%; border: none; cursor: pointer; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); }
        .btn-wa:active { background: #1ebe57; }
        
        .btn-gps-retry { background: none; border: 1px solid #cbd5e0; color: #4a5568; padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; margin-top: 12px; cursor: pointer; }

        .divider { margin: 18px 0; font-size: 0.8rem; color: #a0aec0; }
        .btn-call { display: block; background: #2d3748; color: white; text-decoration: none; padding: 14px; border-radius: 10px; font-size: 0.95rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div style="font-size: 2.8rem;">🚨</div>
    <h1>BANTUAN KECEMASAN (SOS)</h1>
    <p class="desc">Masukkan <strong>Nombor Bib</strong> anda dan tekan butang hijau untuk menghantar bantuan kecemasan ke WhatsApp Medic.</p>

    <!-- Paparan Status GPS Automatik -->
    <div class="gps-box" id="gpsStatus">⏳ Mengesan GPS secara automatik...</div>

    <input type="text" id="bibNo" placeholder="NO. BIB (CONTOH: A1024)">

    <!-- Butang terus buka WhatsApp tanpa tersekat -->
    <button type="button" class="btn-wa" id="btnHantar">📲 HANTAR SOS KE WHATSAPP</button>

    <button type="button" class="btn-gps-retry" id="btnRetry">🔄 Kesan Semula GPS</button>

    <div class="divider">— ATAU —</div>

    <a href="tel:+60139384045" class="btn-call">📞 Panggil Terus Hotline (013-938 4045)</a>
</div>

<script>
    const NO_MEDIC = "60139384045";
    let koordinatMaps = "";

    const gpsStatus = document.getElementById("gpsStatus");
    const btnHantar = document.getElementById("btnHantar");
    const btnRetry = document.getElementById("btnRetry");

    // Fungsi mengesan GPS di latar belakang sebaik sahaja laman dibuka
    function cariLokasi() {
        gpsStatus.innerText = "⏳ Sedang mengesan koordinat GPS...";
        gpsStatus.style.background = "#edf2f7";
        gpsStatus.style.color = "#2d3748";

        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    koordinatMaps = https://google.com{lat},${lng};
                    gpsStatus.innerText = "✅ Lokasi GPS Sedia Dihantar!";
                    gpsStatus.style.background = "#c6f6d5";
                    gpsStatus.style.color = "#22543d";
                },
                function(err) {
                    koordinatMaps = "";
                    gpsStatus.innerText = "⚠️ GPS tidak dapat dikesan (Sila benarkan Location di browser)";
                    gpsStatus.style.background = "#fed7d7";
                    gpsStatus.style.color = "#822727";
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        } else {
            gpsStatus.innerText = "⚠️ Pelayar tidak menyokong GPS.";
        }
    }

    // Jalankan pengesanan GPS sebaik sahaja halaman dibuka
    cariLokasi();

    // Butang kesan semula GPS jika perlu
    btnRetry.addEventListener("click", cariLokasi);

    // Butang Hantar ke WhatsApp (Sentiasa berfungsi walaupun tanpa GPS)
    btnHantar.addEventListener("click", function() {
        const bib = document.getElementById("bibNo").value.trim().toUpperCase();
        
        if (!bib) {
            alert("Sila masukkan Nombor Bib anda!");
            document.getElementById("bibNo").focus();
            return;
        }

        let mesej = 🚨 *KECEMASAN LARIAN (SOS)* 🚨\n\n*No. Bib:* ${bib}\n;
        
        if (koordinatMaps !== "") {
            mesej += *Lokasi GPS:* ${koordinatMaps}\n\n;
        } else {
            mesej += *Lokasi:* (GPS tidak dikesan - akan kongsi Live Location di sini)\n\n;
        }
        
        mesej += Mohon bantuan Medic ke lokasi saya segera!;

        const pautanWA = https://wa.me{NO_MEDIC}?text=${encodeURIComponent(mesej)};
        window.location.assign(pautanWA);
    });
</script>

</body>
</html>
