<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bantuan Kecemasan (SOS)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { 
            /* Lapisan gelap 45% di atas gambar bg.jpg supaya kad putih lebih menonjol */
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #333; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
        }
        .card { 
            background: rgba(255, 255, 255, 0.95); /* Putih sedikit lutsinar supaya nampak moden */
            border-radius: 16px; 
            padding: 25px 20px; 
            max-width: 400px; 
            width: 100%; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            border: 2px solid #feb2b2; 
            text-align: center; 
        }
        h1 { color: #c53030; font-size: 1.35rem; margin: 10px 0; }
        p.desc { font-size: 0.9rem; color: #4a5568; margin-bottom: 18px; line-height: 1.4; }
        .gps-box { background: #edf2f7; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 15px; color: #2d3748; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 14px; font-size: 1.1rem; border: 2px solid #cbd5e0; border-radius: 10px; margin-bottom: 15px; text-align: center; font-weight: bold; text-transform: uppercase; }
        .btn-wa { display: block; background: #25D366; color: white; text-decoration: none; padding: 16px; font-size: 1.05rem; font-weight: bold; border-radius: 10px; width: 100%; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); }
        .divider { margin: 18px 0; font-size: 0.8rem; color: #718096; }
        .btn-call { display: block; background: #2d3748; color: white; text-decoration: none; padding: 14px; border-radius: 10px; font-size: 0.95rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div style="font-size: 2.8rem;">🚨</div>
    <h1>BANTUAN KECEMASAN (SOS)</h1>
    <p class="desc">Masukkan <strong>Nombor Bib</strong> anda dan tekan butang hijau di bawah untuk menghantar lokasi ke WhatsApp Medic.</p>

    <div class="gps-box" id="gpsStatus">📍 Sedia untuk menghantar SOS</div>

    <input type="text" id="bibNo" placeholder="NO. BIB (CTH: A1024)">

    <a href="#" id="btnHantar" class="btn-wa">📲 HANTAR SOS KE WHATSAPP</a>

    <div class="divider">— ATAU —</div>

    <a href="tel:+60139384045" class="btn-call">📞 Panggil Terus Hotline (013-938 4045)</a>
</div>

<script>
    var noMedic = "60139384045";
    var linkMaps = "";
    var inputBib = document.getElementById("bibNo");
    var btnHantar = document.getElementById("btnHantar");
    var gpsStatus = document.getElementById("gpsStatus");

    var asasPeta = String.fromCharCode(104,116,116,112,115,58,47,47,109,97,112,115,46,103,111,111,103,108,101,46,99,111,109,47,63,113,61);

    function kemasKiniMesej() {
        var bib = inputBib.value.trim().toUpperCase();
        if (bib === "") bib = "TIDAK DINYATAKAN";
        
        var mesej = "🚨 KECEMASAN LARIAN (SOS) 🚨\n\n";
        mesej += "No. Bib: " + bib + "\n";
        if (linkMaps !== "") {
            mesej += "Pin Lokasi GPS: " + linkMaps + "\n\n";
        } else {
            mesej += "Pin Lokasi: (GPS tidak dikesan)\n\n";
        }
        mesej += "Mohon bantuan Medic ke lokasi saya segera!\n";
        mesej += "(Nota Peserta: Sila tekan 📎 > Location > Share Live Location jika anda sedang bergerak)";
        
        btnHantar.href = "whatsapp://send?phone=" + noMedic + "&text=" + encodeURIComponent(mesej);
    }

    inputBib.addEventListener("input", kemasKiniMesej);
    kemasKiniMesej();

    if (navigator.geolocation) {
        gpsStatus.innerText = "⏳ Sedang mengesan GPS...";
        navigator.geolocation.getCurrentPosition(
            function(pos) {
                linkMaps = asasPeta + pos.coords.latitude + "," + pos.coords.longitude;
                gpsStatus.innerText = "✅ Koordinat GPS Sedia!";
                gpsStatus.style.background = "#c6f6d5";
                gpsStatus.style.color = "#22543d";
                kemasKiniMesej();
            },
            function() {
                gpsStatus.innerText = "⚠️ GPS tidak aktif (Masih boleh hantar WhatsApp)";
                gpsStatus.style.background = "#fed7d7";
                gpsStatus.style.color = "#822727";
                kemasKiniMesej();
            },
            { enableHighAccuracy: false, timeout: 7000 }
        );
    }
</script>

</body>
</html>
